<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }}</title>
    <link rel="icon" type="image/svg+xml" href='{{ "favicon.svg" | relURL }}'>
    <link rel="icon" type="image/x-icon" href='{{ "favicon.ico" | relURL }}'>
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href='{{ "style.css" | relURL }}'>
    <link rel="canonical" href="{{ if .IsHome }}{{ .Site.Params.otherURL }}{{ else }}{{ .Permalink }}{{ end }}">
    <meta name="description" content="{{ with .Site.Params.description }}{{ . }}{{ end }}">
    <meta property="og:url" content="{{ if .IsHome }}{{ .Site.Params.otherURL }}{{ else }}{{ .Permalink }}{{ end }}">
    <meta property="og:title" content="{{ .Site.Title }}">
    <meta property="og:description" content="{{ with .Site.Params.description }}{{ . }}{{ end }}">
    <meta property="og:image" content='{{ "images/2-1-hydrotherapie-eaux-vives-accueil-og.webp" | absURL }}'>
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="628">
    <meta property="og:image:alt" content="{{ .Site.Title }}">
    <meta property="og:locale" content="{{ .Site.LanguageCode }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="alternate" type="application/ld+json" href='{{ "hydrotherapie-eaux-vives.jsonld" | relURL }}'>
</head>

<body>
    {{ block "main" . }}{{ end }}
    <script src='{{ "scripts.js" | relURL }}'></script>
    <script src='{{ "helpers.js" | relURL }}'></script>
{{/*<!--
-->*/}}
</body>

</html>
