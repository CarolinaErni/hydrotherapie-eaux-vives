
baseURL             = "https://hydrotherapie-eaux-vives.ch/"
languageCode        = "fr-FR"
title               = "Carolina Erni — Hydrothérapie & massages"
canonifyurls        = true
disableRSS          = true
ignoreFiles         = ["static/_stock", ".DS_Store"]

[params]
  otherURL          = "https://hydrotherapie-eaux-vives.ch"
  description       = "Cabinet d’hydrothérapie et de massages aux Eaux-Vives à Genève"
  author            = "Carolina Erni"
  prodURL           = "https://hydrotherapie-eaux-vives.ch"

[outputs]
  home = ["HTML", "Robots", "Sitemap"]
  page = []
  taxonomy = []

[sitemap]
  changefreq = "monthly"
  priority = 0.5

[outputFormats]
  [outputFormats.Robots]
    mediaType = "text/plain"
    baseName = "robots"
    isPlainText = true
    notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      attribute = true

[minify]
  minifyOutput = false
